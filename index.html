<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>發票掃描報帳小幫手</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsqr/1.4.0/jsQR.js"></script>
<style>
  body { font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif; max-width: 480px; margin: 0 auto; padding: 16px; background:#f7f7f8; }
  h1 { font-size: 18px; }
  #wrap { position: relative; }
  video, canvas#overlay { width: 100%; border-radius: 8px; }
  canvas#overlay { position: absolute; top: 0; left: 0; pointer-events: none; }
  #status { margin: 8px 0; font-size: 14px; color: #555; min-height: 20px; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13px; background: #fff; }
  th, td { border: 1px solid #ddd; padding: 6px; text-align: left; }
  th { background: #eee; }
  button { padding: 8px 14px; margin: 4px 4px 4px 0; border: none; border-radius: 6px; background: #333; color: #fff; font-size: 14px; }
  button:disabled { background: #aaa; }
</style>
</head>
<body>

<h1>發票掃描報帳小幫手</h1>
<p id="status">按「開始掃描」，把發票上的 QR Code 對準鏡頭。</p>
<p id="raw" style="font-size:12px; color:#888; word-break:break-all;"></p>

<div id="wrap">
  <video id="video" playsinline muted></video>
  <canvas id="overlay"></canvas>
</div>
<canvas id="hidden" style="display:none;"></canvas>

<button id="startBtn">開始掃描</button>
<button id="exportBtn" disabled>匯出 CSV</button>

<table id="resultTable">
  <thead>
    <tr><th>發票號碼</th><th>日期</th><th>金額</th><th>賣方統編</th></tr>
  </thead>
  <tbody></tbody>
</table>

<script>
// ponytail: 用 jsQR（純 JS，任何瀏覽器都能跑）而非原生 BarcodeDetector，
// 因為 BarcodeDetector 在 iOS Safari 不支援，換一顆 lib 換取相容性比寫 feature-detect 分支簡單。

const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const hidden = document.getElementById('hidden');
const statusEl = document.getElementById('status');
const rawEl = document.getElementById('raw');
const startBtn = document.getElementById('startBtn');
const exportBtn = document.getElementById('exportBtn');
const tbody = document.querySelector('#resultTable tbody');

const seen = new Set(); // 發票號碼去重，避免同一張重複掃到就重複新增
let scanning = false;

// 台灣電子發票 QR Code 固定欄位格式（財政部規範）：
// 發票號碼(10) + 發票日期(7,民國年月日) + 隨機碼(4) + 銷售額(8,16進位) + 總計額(8,16進位) + 買方統編(8) + 賣方統編(8) + 其餘加密/明細資料
function parseInvoiceQR(text) {
  if (text.length < 53) return null;
  const invoiceNo = text.slice(0, 10);
  if (!/^[A-Z]{2}\d{8}$/.test(invoiceNo)) return null; // 不是發票格式就跳過（例如掃到別的QR）

  const rocDate = text.slice(10, 17);
  const totalHex = text.slice(29, 37);
  const sellerId = text.slice(45, 53);

  const year = parseInt(rocDate.slice(0, 3), 10) + 1911;
  const month = rocDate.slice(3, 5);
  const day = rocDate.slice(5, 7);
  const date = `${year}-${month}-${day}`;
  const total = parseInt(totalHex, 16);

  return { invoiceNo, date, total: isNaN(total) ? '' : total, sellerId };
}

function addRow(data) {
  if (seen.has(data.invoiceNo)) return false;
  seen.add(data.invoiceNo);
  const tr = document.createElement('tr');
  tr.innerHTML = `<td>${data.invoiceNo}</td><td>${data.date}</td><td>${data.total}</td><td>${data.sellerId}</td>`;
  tbody.appendChild(tr);
  exportBtn.disabled = false;
  return true;
}

function exportCSV() {
  const rows = [['發票號碼', '日期', '金額', '賣方統編']];
  tbody.querySelectorAll('tr').forEach(tr => {
    rows.push(Array.from(tr.children).map(td => td.textContent));
  });
  const csv = '﻿' + rows.map(r => r.join(',')).join('\n'); // BOM 避免Excel中文亂碼
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '報帳明細.csv';
  a.click();
}

async function startScan() {
  try {
    // ponytail: 明確要求較高解析度，預設解析度太低會讓QR在畫面裡的像素密度不夠、掃不到
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }
    });
    video.srcObject = stream;
    await video.play();
  } catch (e) {
    statusEl.textContent = '無法開啟相機：' + e.message;
    return;
  }
  scanning = true;
  startBtn.disabled = true;
  statusEl.textContent = '掃描中…把發票 QR Code 對準鏡頭';
  requestAnimationFrame(tick);
}

function tick() {
  if (!scanning) return;
  try {
    // 影片剛開始或轉方向時 videoWidth 可能短暫是 0，用 getImageData(0,0,0,0) 會丟例外、
    // 沒接住的話 requestAnimationFrame 迴圈就整個停掉，之後永遠不會再掃 —— 這是之前完全沒反應的主因
    if (video.readyState === video.HAVE_ENOUGH_DATA && video.videoWidth > 0 && video.videoHeight > 0) {
      hidden.width = video.videoWidth;
      hidden.height = video.videoHeight;
      const ctx = hidden.getContext('2d');
      ctx.drawImage(video, 0, 0, hidden.width, hidden.height);
      const imageData = ctx.getImageData(0, 0, hidden.width, hidden.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'attemptBoth' });
      if (code) {
        rawEl.textContent = '掃到的原始內容：' + code.data; // ponytail: debug 用，先看實際掃到什麼再決定要不要修解析規則
        const data = parseInvoiceQR(code.data);
        if (data) {
          const added = addRow(data);
          statusEl.textContent = added ? `已新增：${data.invoiceNo}` : `重複：${data.invoiceNo}（已略過）`;
        } else {
          statusEl.textContent = '有掃到 QR code，但格式不符合發票規則（見下方原始內容）';
        }
      }
    }
  } catch (e) {
    rawEl.textContent = '掃描時發生錯誤：' + e.message; // 有錯誤也要看得到，不要靜靜地把迴圈弄死
  }
  requestAnimationFrame(tick);
}

startBtn.addEventListener('click', startScan);
exportBtn.addEventListener('click', exportCSV);
</script>

</body>
</html>
